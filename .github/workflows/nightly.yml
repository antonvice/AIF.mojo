name: Nightly full validation

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-validation
  cancel-in-progress: true

jobs:
  check-all:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.67.2
          locked: true
          cache: true
      - run: pixi run bootstrap-oracle
      - run: pixi run sync-oracle
      - run: pixi run check-all
